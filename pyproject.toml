[project]
name = "kairo"
version = "0.1.0"
description = "Engineering Intelligence Platform - temporal knowledge graph over GitHub history"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "openai>=1.54",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "tenacity>=9.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
kairo = "kairo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairo"]

[tool.ruff]
line-length = 100
target-version = "py311"
